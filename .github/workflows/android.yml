name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test 2>&1 | tee core-test.log; exit ${PIPESTATUS[0]}

      - name: Compile, unit test and assemble APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Error summary
        if: failure()
        run: |
          for f in core-test.log build.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -nE "^e: |error:|FAILED|What went wrong|Could not (find|resolve)|AAPT|Execution failed" "$f" | head -400 || true
          done

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lens035-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          retention-days: 7

  instrumented:
    name: Emulator tests (GPU pipeline, video export, launch)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests
          retention-days: 7

  release:
    name: Publish APK to Releases
    runs-on: ubuntu-latest
    needs: [build, instrumented]
    # Only fully tested builds of main become a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lens035-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$(find apk -name '*release*.apk' | head -1)" lens035.apk
          cp "$(find apk -name '*debug*.apk' | head -1)" lens035-debug.apk
          version="1.0.${{ github.run_number }}"
          printf '%s\n' \
            "Telefona kurmak için **lens035.apk** dosyasını telefondan indirip aç." \
            "İlk kurulumda tarayıcıya \"bilinmeyen uygulamaları yükleme\" izni vermen gerekir." \
            "" \
            "lens035-debug.apk yalnızca sorun ayıklamak için; normalde gerekmez." > notes.md
          gh release create "v$version" lens035.apk lens035-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lens035 $version" \
            --notes-file notes.md \
            --latest
