name: APK

# Builds the app on GitHub and publishes the APK on the Releases page, so it can be
# downloaded straight to the phone. The repository itself holds only source code.
on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Only the APK: no tests or emulator, so a build takes a few minutes.
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Error summary
        if: failure()
        run: grep -nE "^e: |error:|FAILED|What went wrong|Could not (find|resolve)|AAPT|Execution failed" build.log | head -400 || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" lens035.apk
          version="1.0.${{ github.run_number }}"
          printf '%s\n' \
            "Telefona kurmak için aşağıdaki **lens035.apk** dosyasına telefondan dokunup indir, sonra aç." \
            "İlk kurulumda tarayıcıya \"bilinmeyen uygulamaları yükleme\" izni vermen gerekir." \
            "Yeni sürümler eskisinin üstüne kurulur, düzenlemelerin silinmez." \
            "" \
            "Dal: ${{ github.ref_name }} · ${GITHUB_SHA::7}" > notes.md
          gh release create "v$version" lens035.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lens035 $version" \
            --notes-file notes.md \
            --latest
